{% extends "dashboard/base.html" %}

{% block title %}Verify OTP{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center px-4 bg-gradient-to-br from-primary-50 via-white to-primary-100">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-primary-600 rounded-2xl mb-4 shadow-lg">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Check your email</h1>
            <p class="text-sm text-gray-500 mt-1">We sent a code to <strong>{{ email }}</strong></p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-8">
            {% if messages %}
                {% for message in messages %}
                    <div class="mb-4 px-4 py-3 rounded-lg text-sm {% if message.tags == 'error' %}bg-red-50 text-red-700{% else %}bg-green-50 text-green-700{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <label for="code" class="block text-sm font-medium text-gray-700 mb-2">
                    6-digit code
                </label>
                <input
                    type="text"
                    id="code"
                    name="code"
                    placeholder="000000"
                    required
                    autofocus
                    maxlength="6"
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                    class="w-full px-4 py-3 text-center text-2xl font-bold tracking-widest border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition"
                />

                <button
                    type="submit"
                    class="w-full mt-6 bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 px-4 rounded-xl transition shadow-lg shadow-primary-200"
                >
                    Verify & Sign In
                </button>
            </form>

            <div class="text-center mt-6 space-y-2">
                <a href="{% url 'dashboard_resend_otp' %}" class="block text-sm text-primary-600 hover:text-primary-700 font-medium">
                    Resend code
                </a>
                <a href="{% url 'dashboard_login' %}" class="block text-sm text-gray-500 hover:text-gray-700">
                    Use a different email
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
